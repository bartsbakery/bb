<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barts Bakery</title>

<!-- Simpsons-style fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Segoe UI", Roboto, Arial, sans-serif;

  position: relative;
  overflow: hidden;

  background-image: url("./Backround.jpg");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
}

/* Dark overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background: rgba(0, 15, 25, 0.42);

  z-index: 0;
  pointer-events: none;
}

/* Main Card */
.card {
  position: relative;
  z-index: 1;

  width: 90%;
  max-width: 380px;

  padding: 34px 28px 32px;

  text-align: center;
  color: #fff;

  /* Simpsons-style blue glass */
  background:
    linear-gradient(
      145deg,
      rgba(255, 213, 0, 0.18),
      rgba(0, 91, 130, 0.38)
    );

  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  border: 2px solid rgba(255, 213, 0, 0.55);

  border-radius: 26px;

  box-shadow:
    0 0 10px rgba(255, 213, 0, 0.35),
    0 0 30px rgba(255, 213, 0, 0.18),
    0 25px 50px rgba(0, 0, 0, 0.5);

  animation: fadeIn 0.8s ease;
}

/* Card glow */
.card::before {
  content: "";
  position: absolute;
  inset: -2px;

  border-radius: 26px;

  background: linear-gradient(
    135deg,
    rgba(255, 213, 0, 0.4),
    transparent 40%,
    rgba(0, 180, 220, 0.25)
  );

  z-index: -1;

  filter: blur(10px);
}

/* Animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Bakery Name */
h1 {
  margin: 0 0 30px;

  font-family: "Luckiest Guy", "Bangers", Impact, sans-serif;

  font-size: 36px;
  font-weight: 400;

  letter-spacing: 1px;

  color: #ffd800;

  -webkit-text-stroke: 1.5px #111;

  text-shadow:
    3px 3px 0 #111,
    0 0 8px rgba(255, 216, 0, 0.65),
    0 0 18px rgba(255, 216, 0, 0.3);
}

/* Button Sections */
.button-section {
  margin-bottom: 24px;
}

.button-section:last-child {
  margin-bottom: 0;
}

/* Extra spacing between titles and buttons */
.button-section.with-title {
  margin-top: 8px;
  margin-bottom: 30px;
}

/* Small Section Titles */
.section-title {
  margin: 0 0 13px;

  font-family: "Bangers", Impact, sans-serif;

  font-size: 16px;
  font-weight: 400;

  letter-spacing: 1.5px;

  color: #ffd800;

  text-shadow:
    2px 2px 0 #111,
    0 0 7px rgba(255, 216, 0, 0.5);
}

/* Buttons */
.buttons a {
  display: block;

  width: 100%;
  padding: 16px 14px;

  border-radius: 17px;

  background:
    linear-gradient(
      180deg,
      #fffdf0 0%,
      #fff 100%
    );

  color: #111;

  text-decoration: none;

  font-family: "Luckiest Guy", "Bangers", Impact, sans-serif;

  font-size: 18px;
  font-weight: 400;

  letter-spacing: 0.5px;

  cursor: pointer;

  border: 2px solid rgba(255, 213, 0, 0.9);

  box-shadow:
    0 5px 0 #c5a900,
    0 8px 20px rgba(0, 0, 0, 0.3),
    0 0 12px rgba(255, 213, 0, 0.3);

  transition:
    transform 0.12s ease,
    box-shadow 0.12s ease,
    background 0.2s ease;
}

/* Hover */
.buttons a:hover {
  background: #fff8c9;

  transform: translateY(-2px);

  box-shadow:
    0 7px 0 #c5a900,
    0 12px 25px rgba(0, 0, 0, 0.35),
    0 0 20px rgba(255, 213, 0, 0.6);
}

/* Click */
.buttons a:active {
  transform: translateY(3px);

  box-shadow:
    0 2px 0 #c5a900,
    0 5px 12px rgba(0, 0, 0, 0.25);
}

/* Mobile */
@media (max-width: 480px) {

  body {
    background-attachment: scroll;
  }

  .card {
    width: 90%;

    padding: 30px 22px 28px;

    border-radius: 24px;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 27px;
  }

  .section-title {
    font-size: 15px;
    margin-bottom: 14px;
  }

  .button-section.with-title {
    margin-bottom: 28px;
  }

  .buttons a {
    padding: 15px 12px;
    font-size: 17px;
  }
}
</style>
</head>

<body>

<div class="card">

  <!-- Bakery Name -->
  <h1>BARTS BAKERY</h1>

  <!-- Main WhatsApp Channel -->
  <div class="button-section">
    <div class="buttons">
      <a href="#" id="button1">
        MAIN WHATSAPP CHANNEL
      </a>
    </div>
  </div>

  <!-- Collection / Deliveries -->
  <div class="button-section with-title">

    <div class="section-title">
      COLLECTION / DELIVERIES
    </div>

    <div class="buttons">
      <a href="#" id="button2">
        COLLECTION / DELIVERIES
      </a>
    </div>

  </div>

  <!-- Postals / Collections / Deliveries -->
  <div class="button-section with-title">

    <div class="section-title">
      POSTALS / COLLECTIONS / DELIVERIES
    </div>

    <div class="buttons">
      <a href="#" id="button3">
        POSTALS / COLLECTIONS / DELIVERIES
      </a>
    </div>

  </div>

</div>

</body>
</html>
