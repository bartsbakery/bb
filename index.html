<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barts Bakery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: "Segoe UI", Roboto, Arial, sans-serif;

    position: relative;
    overflow: hidden;

    background-image: url("./Backround.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

/* Dark overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background: rgba(0, 15, 25, 0.42);

    z-index: 0;
    pointer-events: none;
}


/* ==============================
   SNOW
   ============================== */

.snow {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    z-index: 1;
    pointer-events: none;
}

.snowflake {
    position: absolute;

    top: -80px;

    width: var(--size);
    height: var(--size);

    background-image: url("./snoweffect.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;

    opacity: var(--opacity);

    animation-name: snowFall;
    animation-duration: var(--speed);
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-delay: var(--delay);

    will-change: transform;
}

@keyframes snowFall {

    0% {
        transform:
            translate3d(0, -100px, 0)
            rotate(0deg);
    }

    20% {
        transform:
            translate3d(var(--move1), 20vh, 0)
            rotate(72deg);
    }

    40% {
        transform:
            translate3d(var(--move2), 40vh, 0)
            rotate(144deg);
    }

    60% {
        transform:
            translate3d(var(--move3), 60vh, 0)
            rotate(216deg);
    }

    80% {
        transform:
            translate3d(var(--move4), 80vh, 0)
            rotate(288deg);
    }

    100% {
        transform:
            translate3d(var(--move5), 115vh, 0)
            rotate(360deg);
    }
}


/* ==============================
   MAIN CARD
   ============================== */

.card {
    position: relative;
    z-index: 2;

    width: 90%;
    max-width: 380px;

    padding: 34px 28px 32px;

    text-align: center;
    color: #fff;

    /* More transparent glass */
    background:
        linear-gradient(
            145deg,
            rgba(255, 213, 0, 0.08),
            rgba(0, 91, 130, 0.18)
        );

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 2px solid rgba(255, 213, 0, 0.55);

    border-radius: 26px;

    box-shadow:
        0 0 10px rgba(255, 213, 0, 0.35),
        0 0 30px rgba(255, 213, 0, 0.18),
        0 25px 50px rgba(0, 0, 0, 0.5);

    animation: fadeIn 0.8s ease;
}


/* Card glow */
.card::before {
    content: "";

    position: absolute;
    inset: -2px;

    border-radius: 26px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 213, 0, 0.4),
            transparent 40%,
            rgba(0, 180, 220, 0.25)
        );

    z-index: -1;

    filter: blur(10px);
}


@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* ==============================
   BAKERY TITLE
   ============================== */

h1 {
    margin: 0 0 30px;

    font-family:
        "Luckiest Guy",
        "Bangers",
        Impact,
        sans-serif;

    font-size: 36px;

    font-weight: 400;

    letter-spacing: 1px;

    color: #ffd800;

    -webkit-text-stroke: 1.5px #111;

    text-shadow:
        3px 3px 0 #111,
        0 0 8px rgba(255, 216, 0, 0.65),
        0 0 18px rgba(255, 216, 0, 0.3);
}


/* ==============================
   BUTTON SECTIONS
   ============================== */

.button-section {
    margin-bottom: 24px;
}

.button-section:last-child {
    margin-bottom: 0;
}

.button-section.with-title {
    margin-top: 8px;
    margin-bottom: 30px;
}


/* Section titles */
.section-title {
    margin: 0 0 13px;

    font-family:
        "Bangers",
        Impact,
        sans-serif;

    font-size: 16px;

    font-weight: 400;

    letter-spacing: 1.5px;

    color: #ffd800;

    text-shadow:
        2px 2px 0 #111,
        0 0 7px rgba(255, 216, 0, 0.5);
}


/* ==============================
   BUTTONS
   ============================== */

.buttons a {
    display: block;

    width: 100%;

    padding: 16px 14px;

    border-radius: 17px;

    background:
        linear-gradient(
            180deg,
            #fffdf0 0%,
            #fff 100%
        );

    color: #111;

    text-decoration: none;

    font-family:
        "Luckiest Guy",
        "Bangers",
        Impact,
        sans-serif;

    font-size: 18px;

    font-weight: 400;

    letter-spacing: 0.5px;

    cursor: pointer;

    border: 2px solid rgba(255, 213, 0, 0.9);

    box-shadow:
        0 5px 0 #c5a900,
        0 8px 20px rgba(0, 0, 0, 0.3),
        0 0 12px rgba(255, 213, 0, 0.3);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background 0.2s ease;
}


/* Hover */
.buttons a:hover {
    background: #fff8c9;

    transform: translateY(-2px);

    box-shadow:
        0 7px 0 #c5a900,
        0 12px 25px rgba(0, 0, 0, 0.35),
        0 0 20px rgba(255, 213, 0, 0.6);
}


/* Click */
.buttons a:active {
    transform: translateY(3px);

    box-shadow:
        0 2px 0 #c5a900,
        0 5px 12px rgba(0, 0, 0, 0.25);
}


/* ==============================
   MOBILE
   ============================== */

@media (max-width: 480px) {

    body {
        background-attachment: scroll;
    }

    .card {
        width: 90%;

        padding: 30px 22px 28px;

        border-radius: 24px;
    }

    h1 {
        font-size: 32px;

        margin-bottom: 27px;
    }

    .section-title {
        font-size: 15px;

        margin-bottom: 14px;
    }

    .button-section.with-title {
        margin-bottom: 28px;
    }

    .buttons a {
        padding: 15px 12px;

        font-size: 17px;
    }
}
</style>
</head>

<body>

<!-- SNOW LAYER -->
<div class="snow">

    <div class="snowflake"
         style="left: 2%; --size: 26px; --opacity: .80; --speed: 12s; --delay: -3s; --move1: 25px; --move2: -15px; --move3: 20px; --move4: -10px; --move5: 15px;">
    </div>

    </div>

    </div>

    <div class="snowflake"

    <div class="snowflake"

    <div class="snowflake"

    </div>

    <div class="snowflake"

    </div>

    <div class="snowflake"
         style="left: 73%; --size: 19px; --opacity: .65; --speed: 12s; --delay: -6s; --move1: -25px; --move2: 20px; --move3: -20px; --move4: 15px; --move5: -15px;">
    </div>

    <div class="snowflake"
         style="left: 84%; --size: 31px; --opacity: .85; --speed: 14s; --delay: -9s; --move1: 25px; --move2: -25px; --move3: 20px; --move4: -15px; --move5: 20px;">
    </div>

    <div class="snowflake"
         style="left: 95%; --size: 24px; --opacity: .75; --speed: 10s; --delay: -2s; --move1: -20px; --move2: 25px; --move3: -15px; --move4: 20px; --move5: -10px;">
    </div>

</div>


<!-- MAIN CARD -->

</body>
</html>
