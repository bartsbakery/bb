<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barts Bakery</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Segoe UI", Roboto, Arial, sans-serif;

  position: relative;
  overflow: hidden;

  background-image: url("./Backround.jpg");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
}

/* Dark overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background: rgba(0, 0, 0, 0.45);

  z-index: 0;
  pointer-events: none;
}

/* Main Card */
.card {
  position: relative;
  z-index: 1;

  width: 90%;
  max-width: 380px;

  padding: 35px 28px;

  text-align: center;
  color: white;

  background: rgba(255, 255, 255, 0.14);

  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  border: 1px solid rgba(255, 255, 255, 0.12);

  border-radius: 24px;

  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);

  animation: fadeIn 0.8s ease;
}

/* Animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Bakery Name */
h1 {
  margin: 0 0 30px;

  font-size: 26px;
  font-weight: 700;

  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}

/* Button Sections */
.button-section {
  margin-bottom: 18px;
}

.button-section:last-child {
  margin-bottom: 0;
}

/* Small Section Titles */
.section-title {
  margin: 0 0 8px;

  font-family: Georgia, "Times New Roman", serif;

  font-size: 14px;
  font-weight: 600;

  letter-spacing: 1.2px;
  text-transform: lowercase;

  color: rgba(255, 255, 255, 0.95);

  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
}

/* Buttons */
.buttons a {
  display: block;

  width: 100%;
  padding: 16px;

  border-radius: 16px;

  background: #fff;
  color: #000;

  text-decoration: none;

  font-size: 17px;
  font-weight: 700;

  cursor: pointer;

  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);

  transition:
    transform 0.12s ease,
    box-shadow 0.12s ease,
    background 0.2s ease;
}

.buttons a:hover {
  transform: translateY(-2px);

  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);

  background: #f5f5f5;
}

.buttons a:active {
  transform: scale(0.97);

  box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
}

/* Mobile */
@media (max-width: 480px) {

  body {
    background-attachment: scroll;
  }

  .card {
    width: 90%;
    padding: 30px 22px;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 26px;
  }

  .section-title {
    font-size: 13px;
  }

  .buttons a {
    padding: 15px;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div class="card">

  <!-- Bakery Name -->
  <h1>Barts Bakery</h1>

  <!-- Main WhatsApp Channel -->
  <div class="button-section">
    <div class="buttons">
      <a href="#" id="button1">
        Main WhatsApp Channel
      </a>
    </div>
  </div>

  <!-- Collection / Deliveries -->
  <div class="button-section">
    <div class="section-title">
      collection / deliveries
    </div>

    <div class="buttons">
      <a href="#" id="button2">
        Collection / Deliveries
      </a>
    </div>
  </div>

  <!-- Postals / Collections / Deliveries -->
  <div class="button-section">
    <div class="section-title">
      postals / collections / deliveries
    </div>

    <div class="buttons">
      <a href="#" id="button3">
        Postals / Collections / Deliveries
      </a>
    </div>
  </div>

</div>

</body>
</html>
