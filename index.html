<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Segoe UI", Roboto, Arial, sans-serif;

  position: relative;
  overflow: hidden;

  background-image: url("./Backround.jpg");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
}

/* Dark overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background: rgba(0, 15, 25, 0.42);

  z-index: 0;
  pointer-events: none;
}

/* =========================
   SNOW
   ========================= */

.snow {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 1;

  pointer-events: none;

  overflow: hidden;
}

/* Individual falling snow */
.snowflake {
  position: absolute;

  top: -100px;

  width: var(--size);
  height: var(--size);

  animation: fall var(--speed) linear infinite;

  animation-delay: var(--delay);

  will-change: transform;
}

/* Snow image itself */
.snowflake::after {
  content: "";

  position: absolute;

  inset: 0;

  background-image: url("./snoweffect.png");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;

  opacity: var(--opacity);

  animation: rotateSnow var(--rotation) linear infinite;

  will-change: transform;
}

/* FALL FROM TOP TO BOTTOM */
@keyframes fall {

  0% {
    transform: translate3d(0, -120px, 0);
  }

  25% {
    transform: translate3d(var(--drift1), 25vh, 0);
  }

  50% {
    transform: translate3d(var(--drift2), 50vh, 0);
  }

  75% {
    transform: translate3d(var(--drift3), 75vh, 0);
  }

  100% {
    transform: translate3d(var(--drift4), 115vh, 0);
  }

}

/* SLOW CLOCKWISE SPIN */
@keyframes rotateSnow {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}


/* =========================
   MAIN CARD
   ========================= */

.card {
  position: relative;
  z-index: 2;

  width: 90%;
  max-width: 380px;

  padding: 34px 28px 32px;

  text-align: center;
  color: #fff;

  /* More transparent glass */
  background:
    linear-gradient(
      145deg,
      rgba(255, 213, 0, 0.09),
      rgba(0, 91, 130, 0.20)
    );

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border: 2px solid rgba(255, 213, 0, 0.55);

  border-radius: 26px;

  box-shadow:
    0 0 10px rgba(255, 213, 0, 0.35),
    0 0 30px rgba(255, 213, 0, 0.18),
    0 25px 50px rgba(0, 0, 0, 0.5);

  animation: fadeIn 0.8s ease;
}

/* Card glow */
.card::before {
  content: "";

  position: absolute;

  inset: -2px;

  border-radius: 26px;

  background:
    linear-gradient(
      135deg,
      rgba(255, 213, 0, 0.4),
      transparent 40%,
      rgba(0, 180, 220, 0.25)
    );

  z-index: -1;

  filter: blur(10px);
}

/* Card animation */
@keyframes fadeIn {

  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


/* =========================
   BAKERY NAME
   ========================= */

h1 {
  margin: 0 0 30px;

  font-family:
    "Luckiest Guy",
    "Bangers",
    Impact,
    sans-serif;

  font-size: 36px;

  font-weight: 400;

  letter-spacing: 1px;

  color: #ffd800;

  -webkit-text-stroke: 1.5px #111;

  text-shadow:
    3px 3px 0 #111,
    0 0 8px rgba(255, 216, 0, 0.65),
    0 0 18px rgba(255, 216, 0, 0.3);
}


/* =========================
   BUTTON SECTIONS
   ========================= */

.button-section {
  margin-bottom: 24px;
}

.button-section:last-child {
  margin-bottom: 0;
}

.button-section.with-title {
  margin-top: 8px;
  margin-bottom: 30px;
}


/* Section titles */
.section-title {
  margin: 0 0 13px;

  font-family:
    "Bangers",
    Impact,
    sans-serif;

  font-size: 16px;

  font-weight: 400;

  letter-spacing: 1.5px;

  color: #ffd800;

  text-shadow:
    2px 2px 0 #111,
    0 0 7px rgba(255, 216, 0, 0.5);
}


/* =========================
   BUTTONS
   ========================= */

.buttons a {
  display: block;

  width: 100%;

  padding: 16px 14px;

  border-radius: 17px;

  background:
    linear-gradient(
      180deg,
      #fffdf0 0%,
      #fff 100%
    );

  color: #111;

  text-decoration: none;

  font-family:
    "Luckiest Guy",
    "Bangers",
    Impact,
    sans-serif;

  font-size: 18px;

  font-weight: 400;

  letter-spacing: 0.5px;

  cursor: pointer;

  border: 2px solid rgba(255, 213, 0, 0.9);

  box-shadow:
    0 5px 0 #c5a900,
    0 8px 20px rgba(0, 0, 0, 0.3),
    0 0 12px rgba(255, 213, 0, 0.3);

  transition:
    transform 0.12s ease,
    box-shadow 0.12s ease,
    background 0.2s ease;
}


/* Hover */
.buttons a:hover {

  background: #fff8c9;

  transform: translateY(-2px);

  box-shadow:
    0 7px 0 #c5a900,
    0 12px 25px rgba(0, 0, 0, 0.35),
    0 0 20px rgba(255, 213, 0, 0.6);
}


/* Click */
.buttons a:active {

  transform: translateY(3px);

  box-shadow:
    0 2px 0 #c5a900,
    0 5px 12px rgba(0, 0, 0, 0.25);
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 480px) {

  body {
    background-attachment: scroll;
  }

  .card {

    width: 90%;

    padding: 30px 22px 28px;

    border-radius: 24px;

    font-size: 32px;

    margin-bottom: 27px;
  }

  }

  .button-section.with-title {

    margin-bottom: 28px;
  }

  .buttons a {

    padding: 15px 12px;

    font-size: 17px;
  }

}

</style>
